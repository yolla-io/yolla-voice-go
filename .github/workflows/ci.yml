name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: tools/go.sum
      - run: make check
      - if: matrix.go == '1.27'
        run: make check-gen
      - if: matrix.go == '1.27'
        run: make check-public
      - if: matrix.go == '1.27'
        run: make check-deps
