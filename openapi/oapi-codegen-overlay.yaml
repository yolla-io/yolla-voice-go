# Applied by make gen to the OpenAPI 3.0 copy of the contract before generation.
overlay: 1.0.0
info:
  title: Generated models
  version: 1.0.0
actions:
  # Models come from component schemas only. Request parameters and bodies are
  # hand-written in the SDK, so operations and the components only they use are
  # removed before generation.
  - target: $.paths.*
    remove: true
  - target: $.components.parameters
    remove: true
  - target: $.components.responses
    remove: true
  - target: $.components.pathItems
    remove: true
  # Request bodies, error bodies and webhook events are hand-written in the SDK
  # (CreateCallParams, APIError, the Event types), so their schemas are removed
  # to keep a single public type for each.
  - target: $.components.schemas.CreateCallRequest
    remove: true
  - target: $.components.schemas.ErrorBody
    remove: true
  - target: $.components.schemas.ErrorResponse
    remove: true
  - target: $.components.schemas.EventEnvelope
    remove: true
  - target: $.components.schemas.CallEvent
    remove: true
  - target: $.components.schemas.QualityEvent
    remove: true
  - target: $.components.schemas.BalanceEvent
    remove: true
  - target: $.components.schemas.TestEvent
    remove: true
